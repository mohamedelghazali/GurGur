[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gurgur"
version = "0.2.0.dev0"
description = "GurGur: bounded private-network traffic measurement and DDoS defense research lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "pytest-cov>=5.0,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
